<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!--
      Hidden copy of the intake form so Netlify detects it at deploy time.
      The real form is src/components/IntakeForm.tsx. Every field name it sends must be listed here.
    -->
    <form name="intake" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="intake" />
      <input name="bot-field" />
      <input name="subject" />
      <input name="language" />
      <input name="name" />
      <input name="business" />
      <input name="phone" />
      <input name="email" />
      <input name="contact_method" />
      <input name="best_time" />
      <input type="checkbox" name="services" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
